############################################
# Picom - simple i3 configuration
############################################

# Backend
backend = "glx";
vsync = true;

# General
daemon = false;
use-damage = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.35;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;

# Transparency
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;

# Don't make windows transparent by default
opacity-rule = [
    "100:class_g = 'Pavucontrol'",
    "100:class_g = 'pavucontrol'"
];

# Rounded corners
corner-radius = 8;

rounded-corners-exclude = [
    "class_g = 'i3bar'",
    "class_g = 'Polybar'",
    "class_g = 'pavucontrol'",
    "class_g = 'Pavucontrol'"
];

# Blur
blur-method = "dual_kawase";
blur-strength = 5;

# Don't blur these
blur-background-exclude = [
    "class_g = 'pavucontrol'",
    "class_g = 'Pavucontrol'",
    "class_g = 'Polybar'",
    "class_g = 'i3bar'"
];

# Misc
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

# Wintypes
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; }
    dnd = { shadow = false; }
    popup_menu = { opacity = 1.0; }
    dropdown_menu = { opacity = 1.0; }
    utility = { opacity = 1.0; }
};